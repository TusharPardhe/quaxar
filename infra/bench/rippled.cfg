[server]
port_rpc
port_ws

[port_rpc]
port = 5005
ip = 0.0.0.0
admin = 0.0.0.0
protocol = http

[port_ws]
port = 6006
ip = 0.0.0.0
admin = 0.0.0.0
protocol = ws
send_queue_limit = 500

[node_size]
medium

[node_db]
type = NuDB
path = /var/lib/xrpld/db/nudb
online_delete = 512
advisory_delete = 0

[database_path]
/var/lib/xrpld/db

[ledger_history]
256

[debug_logfile]
/var/lib/xrpld/debug.log

[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
0
