[server]
port_rpc_admin_local
port_ws_admin_local
port_peer

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_ws_admin_local]
port = 6006
ip = 127.0.0.1
admin = 127.0.0.1
protocol = ws

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[node_size]
medium

[node_db]
type = fjall
path = /var/lib/quaxar/db/fjall
online_delete = 512
advisory_delete = 0
reserve_mb = 1024
# IMPORTANT: compaction_base_mb is fixed when the store is created. On a pruned
# node set it to about half the node store's live data, or deleted entries
# pile up and stall writes (missed ledgers):
#   live_MB ≈ state_MB + online_delete × ledger_MB   (mainnet: 6500 + 512 × 2.7)
#   compaction_base_mb ≈ live_MB ÷ 2, rounded up to a power of two
# Mainnet, online_delete 512: 4096. Full history (online_delete = 0): 256.
# See docs/CONFIGURATION.md "Sizing compaction_base_mb".
compaction_base_mb = 4096

[database_path]
/var/lib/quaxar/db

[ledger_history]
256

