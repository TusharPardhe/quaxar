[package]
name = "shamap"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "shamap"
path = "src/lib.rs"

[features]
shadow-hash = []

[dependencies]
parking_lot = "0.12"
basics = { path = "../basics" }
sha2 = { version = "0.10", features = ["asm"] }
time = "0.3"
tracing = "0.1"
