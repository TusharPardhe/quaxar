name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++' >> "$GITHUB_ENV"
          echo 'AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar' >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p quaxar-main
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../quaxar-${{ matrix.target }}.tar.gz quaxar
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum quaxar-${{ matrix.target }}.tar.gz > quaxar-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 quaxar-${{ matrix.target }}.tar.gz > quaxar-${{ matrix.target }}.tar.gz.sha256
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quaxar-${{ matrix.target }}
          path: |
            quaxar-${{ matrix.target }}.tar.gz
            quaxar-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            quaxar-*/*.tar.gz
            quaxar-*/*.sha256
