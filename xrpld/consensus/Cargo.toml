[package]
name = "consensus"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "consensus"
path = "src/lib.rs"

[dependencies]
basics = { path = "../../xrpl/basics" }
protocol = { path = "../../xrpl/protocol" }
ledger = { path = "../ledger" }
shamap = { path = "../../xrpl/shamap" }
parking_lot = "0.12"
rand = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
time = "0.3"
tracing = "0.1"
