publish = false

[lib]
name = "quaxar_core"
path = "src/lib.rs"

[dependencies]
basics = { path = "../../xrpl/basics" }
ipnet = "2"
protocol = { path = "../../xrpl/protocol" }
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
