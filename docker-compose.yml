services:
  quaxar:
    build: .
    container_name: quaxar
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:5005"   # Local admin RPC
      - "127.0.0.1:6006:6006"   # Local admin WebSocket
      - "51235:51235" # Peer protocol
    volumes:
      - quaxar-data:/var/lib/quaxar
      - ${QUAXAR_CONFIG_FILE:-./quaxar.cfg}:/etc/quaxar/quaxar.cfg:ro
    deploy:
      resources:
        limits:
          memory: 16G
    healthcheck:
      test: ["CMD", "quaxar", "health", "--rpc-url", "http://127.0.0.1:5005"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  quaxar-data:
    # Reuse the volume created by the pre-rename Compose project. Override
    # QUAXAR_DATA_VOLUME when the old project used a different project name.
    name: "${QUAXAR_DATA_VOLUME:-quaxar_xrpld-data}"
